name: v1.6.0 integration checks
on:
  push:
    branches: [prepare-v1.6.0-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROGRESS_IN_PROCESS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -p 'test_*.py' -v
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          for f in *.js *.cjs; do node --check "$f"; done
      - name: JavaScript regression checks
        run: |
          for f in test_*.cjs; do node "$f"; done
